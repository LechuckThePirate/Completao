name: CI

# Tests (busted) and luacheck on every push and pull request, as in Questie. Lua 5.1: the game's version.
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run luacheck
        uses: nebularg/actions-luacheck@dd48c197053814ed6e9e73f34ac37051b48a4bbf # v1
        with:
          files: Completao.lua Localization Modules Data/Dungeons.lua Data/Raids.lua Data/Overrides.lua Data/Data.test.lua Completao.test.lua test setupTests.lua
          args: -q

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@8aace3457a2fcf3f3c4e9007ecc6b869ff6d74d # v11
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@4c082a5fad45388feaeb0798dbd82dbd7dc65bca # v5

      - name: Install busted
        run: luarocks install busted

      - name: Run tests
        run: busted -p ".test.lua" .
