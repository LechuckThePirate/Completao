name: Update web data

# The rewards and the new quests (Data/Forever/Generated/Rewards.lua and ForeverNew.lua) are generated by a daily job on the
# maintainer's server, which publishes the two files at the media host. This workflow fetches them, runs the tests
# and opens a pull request when they differ from the repo. Nothing is merged here. The server holds no credentials
# for this repo; this is the only way those files get in. A warning (not a failure) is raised while the server job
# works from open data because the web sources refuse it. Needs the repo setting "Allow GitHub Actions to create
# and approve pull requests".
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-web-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the published files
        id: download
        run: |
          base=https://media.joanvilarino.online/completao-data
          # a stale stamp means the server job stopped: fail so it gets noticed
          stamp=$(curl -fsS --retry 3 "$base/updated.txt")
          age=$(( $(date +%s) - $(date -d "$stamp" +%s) ))
          if [ "$age" -gt $(( 3 * 86400 )) ]; then
            echo "::error::The published data is $(( age / 3600 )) hours old ($stamp)"
            exit 1
          fi
          # "open since <date>" when the server could not reach the web sources and used open data instead
          source=$(curl -fsS --retry 3 "$base/source.txt" || echo unknown)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          case "$source" in
            open*) echo "::warning::The web sources have not answered the server job ($source): the rewards of new quests come from open data" ;;
          esac
          for f in Rewards.lua ForeverNew.lua; do
            curl -fsS --retry 3 -o "$RUNNER_TEMP/$f" "$base/$f"
            # shape checks, so an error page or a truncated file never reaches a pull request
            [ "$(wc -c < "$RUNNER_TEMP/$f")" -gt 10000 ]
            [ "$(head -1 "$RUNNER_TEMP/$f")" = 'local _, ns = ...' ]
            grep -q '^-- GENERATED' "$RUNNER_TEMP/$f"
            cp "$RUNNER_TEMP/$f" "Data/Forever/Generated/$f"
          done
          grep -q '^ns.REWARDS = {' Data/Forever/Generated/Rewards.lua

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain Data/Forever/Generated)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Data/Forever/Generated is already up to date with the published files."
          fi

      # Pull requests opened with the default token do not trigger ci.yml, so the tests run here.
      - name: Install Lua 5.1
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1

      - name: Install busted
        if: steps.changes.outputs.changed == 'true'
        run: luarocks install busted

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: busted -p ".test.lua" .

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto/web-data
          base: master
          add-paths: Data/Forever/Generated
          commit-message: "data: refresh rewards and new quests"
          title: "data: refresh rewards and new quests"
          body: |
            Automated daily refresh of the rewards and the new quests (`Data/Forever/Generated/Rewards.lua`,
            `ForeverNew.lua`), generated on the maintainer's server and fetched here. Busted passed on this branch.
            Data source of this run: `${{ steps.download.outputs.source }}` (`open since ...` means the web sources
            were out of reach and the rewards of quests without a cached row come from open data, which can miss
            Forever's changes).

            Review the diff, add a line under `## Unreleased` in `CHANGELOG.md` if it is worth telling players
            about, and merge. If this PR is closed without merging, the next run opens a new one.
